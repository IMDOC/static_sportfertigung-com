<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Page Not Found | Sport Fertigung</title>
<style>
:root{--brand:#2563EB}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
background:#0F172A;color:#fff;padding:24px;text-align:center}
.w{max-width:560px}
.code{font-size:clamp(64px,14vw,120px);font-weight:800;line-height:1;color:var(--brand);letter-spacing:-.03em}
h1{font-size:clamp(20px,4vw,28px);margin:12px 0 10px;font-weight:700}
p{color:#94A3B8;line-height:1.6;margin:0 0 26px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-block;padding:13px 26px;border-radius:8px;text-decoration:none;font-weight:600;font-size:15px}
a.pri{background:var(--brand);color:#fff}
a.sec{border:1px solid rgba(255,255,255,.28);color:#fff}
a.sec:hover{border-color:var(--brand);color:var(--brand)}
</style>
</head>
<body>
<div class="w">
  <div class="code">404</div>
  <h1>This page doesn't exist</h1>
  <p>The page you're looking for may have been moved or renamed. Head back to the homepage, or get in touch and we'll point you to the right place.</p>
  <div class="btns">
    <a class="btn pri" href="/">Back to Home</a>
    <a class="btn sec" href="/contact">Contact Us</a>
  </div>
</div>
</body>
</html>
